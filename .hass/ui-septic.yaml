views:
  - path: default_view
    title: Septic
    badges:
      - type: entity
        entity: weather.demo_weather_north
        color: red
    cards:
      - type: tile
        entity: climate.ecobee
        name: Climate
      - type: custom:septic-tile-card
        entities:
          level: sensor.septic_tank_liquid_level
          temp: sensor.septic_tank_temperature
          pressure: sensor.septic_tank_pressure
          x_level: sensor.septic_tank_critical_level
          exceeds_x_level: binary_sensor.septic_tank_exceeds_critical_level
          error_name: sensor.septic_tank_error
          sdt: sensor.septic_tank_sdt
      - type: custom:stack-in-card
        cards:
          - type: custom:gauge-card-pro
            entity: sensor.septic_tank_liquid_level
            name: Septic tank liquid level
            titles:
              primary: Septic tank liquid level
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: "#43A047"
              - from: 60
                color: "#FBC02D"
              - from: 90
                color: "#E53935"
            setpoint:
              type: template
              value: >
                {{ states('sensor.septic_tank_critical_level') | float(90) }}
              color: red
            card_mod:
              style: |
                ha-card {
                  background: none !important;
                  box-shadow: none !important;
                  border: none !important;
                  padding-bottom: 0 !important;
                }

          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.septic_tank_temperature
                name: Temperature
                icon: mdi:thermometer
              - entity: sensor.septic_tank_pressure
                name: Pressure
                icon: mdi:gauge
              - entity: sensor.septic_tank_critical_level
                name: Critical level
                icon: mdi:water-minus
              - entity: binary_sensor.septic_tank_exceeds_critical_level
                name: Exceeds critical level
                icon: mdi:water-alert
              - entity: sensor.septic_tank_sdt
                name: SDT
                icon: mdi:signal
              - entity: sensor.septic_tank_error
                name: Error
                icon: mdi:alert-decagram-outline
            card_mod:
              style: |
                ha-card {
                  background: none !important;
                  box-shadow: none !important;
                  border: none !important;
                  padding-top: 0 !important;
                }
        card_mod:
          style: |
            ha-card {
              border-radius: var(--ha-card-border-radius, 12px);
              overflow: hidden;
            }

      - type: custom:septic-tank-card
        entities:
          level: sensor.septic_tank_liquid_level
          temp: sensor.septic_tank_temperature
          pressure: sensor.septic_tank_pressure
          x_level: sensor.septic_tank_critical_level
          exceeds_x_level: binary_sensor.septic_tank_exceeds_critical_level
          error_name: sensor.septic_tank_error
          sdt: sensor.septic_tank_sdt
        tank:
          header:
            show: true
            label: My Septic Tank
          level:
            show: true
          scale:
            position: left

      - type: custom:stack-in-card
        cards:
          - type: gauge
            entity: sensor.septic_tank_liquid_level
            name: Septic tank liquid level
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 60
              red: 90
            card_mod:
              style: |
                ha-card {
                  background: none !important;
                  box-shadow: none !important;
                  border: none !important;
                  padding-bottom: 0 !important;
                }

          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.septic_tank_temperature
                name: Temperature
                icon: mdi:thermometer
              - entity: sensor.septic_tank_pressure
                name: Pressure
                icon: mdi:gauge
              - entity: sensor.septic_tank_critical_level
                name: Critical level
                icon: mdi:water-minus
              - entity: binary_sensor.septic_tank_exceeds_critical_level
                name: Exceeds critical level
                icon: mdi:water-alert
              - entity: sensor.septic_tank_sdt
                name: SDT
                icon: mdi:signal
              - entity: sensor.septic_tank_error
                name: Error
                icon: mdi:alert-decagram-outline
            card_mod:
              style: |
                ha-card {
                  background: none !important;
                  box-shadow: none !important;
                  border: none !important;
                  padding-top: 0 !important;
                }
        card_mod:
          style: |
            ha-card {
              border-radius: var(--ha-card-border-radius, 12px);
              overflow: hidden;
            }

      - type: entities
        title: Septic
        state_color: false
        show_header_toggle: false
        entities:
          - entity: sensor.septic_tank_liquid_level
            name: Liquid level
            icon: mdi:water-percent
          - entity: sensor.septic_tank_temperature
            name: Temperature
            icon: mdi:thermometer
          - entity: sensor.septic_tank_pressure
            name: Pressure
            icon: mdi:gauge
          - entity: sensor.septic_tank_critical_level
            name: Critical level
            icon: mdi:water-minus
          - entity: binary_sensor.septic_tank_exceeds_critical_level
            name: Exceeds critical level
            icon: mdi:water-alert
          - entity: sensor.septic_tank_sdt
            name: SDT
            icon: mdi:signal
          - entity: sensor.septic_tank_error
            name: Error
            icon: mdi:alert-decagram-outline
      - type: thermostat
        entity: climate.ecobee
        name: Climate
